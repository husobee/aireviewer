# Example repository configuration for aireviewer. See SPEC.md §13.
# Most of these settings take effect in later milestones.
forge: auto                  # auto | github | gitlab
# gitlab_base_url: https://gitlab.example.com
base_branch: main

issue_link:                  # /pr-create issue retrieval (SPEC §8.2)
  threshold: 0.70            # candidates scored at or above this are linked with a closing keyword
  include_closed_days: 30    # also consider issues closed this recently
  allow_create: true         # may /pr-create propose (and, on confirmation, create) a new issue
  max_candidates: 20

policies:
  rules:
    - "All exported Go funcs need doc comments"
  files: [CONTRIBUTING.md, CLAUDE.md]

static_analysis:
  - "golangci-lint run --output.json.path stdout ./..."

runtime:                     # sandboxed execution; every run needs your confirmation (ADR 0008)
  enabled: true
  image: golang:1.26           # pin by digest (golang:1.26@sha256:…) so the image cannot change between runs
  setup: ["go mod download"]   # runs once per side before the commands
  setup_network: true          # network for setup only (dependency downloads)
  commands: ["go build ./...", "go test -json ./..."]   # -json gives per-test flaky detection
  reruns: 3                    # failures are re-run this many times before classification
  network: false               # network for commands and analyzers
  timeout_s: 900               # per command
  memory: 4g
  cpus: "2"
  # env: { GOFLAGS: "-mod=mod" }

risk:
  bugfix_keywords: [fix, bug, hotfix, regression]
  bug_labels: [bug, incident]   # not active yet (M6): merged PRs/MRs with these labels will count as bug fixes
  min_history_commits: 20

reviewers:
  weights: { expertise: 0.35, experience: 0.2, ownership: 0.2, workload: 0.15, knowledge_share: 0.1 }
  exclude: [dependabot, renovate]

comments:
  toxicity: warn             # off | warn | block
  usefulness: warn
  provenance_footer: true    # footer with the decision-log head hash on posted reviews
  # voice: "Concise and kind; prefer questions over commands."  # team default review voice; reviewers' personal voices take precedence

review:
  require_critique: false    # require the reviewer's own note before posting ("PR Critique", paper l.1748)
  reviewer_first: false      # hide AI findings until every unit has been viewed (automation bias)
  low_confidence_breaker: true  # low-confidence/disputed findings need an override to be posted

gate:
  trusted_bots: []           # accounts whose posted aireviewer summaries may be imported

create:
  signoff: false             # add a DCO Signed-off-by trailer to the fix commit (signing follows commit.gpgSign)

ci:
  post_augmentation: false   # the only automated post allowed; opt-in (ADR 0003)

limits:
  max_diff_lines: 4000
  max_parallel_agents: 6
  lazy_fix_suggestions: true

memory:
  enabled: true
  retention_days: 365
