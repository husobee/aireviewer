name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the command, forge (GitHub/GitLab, hosted or self-managed), and error output." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: input
    id: version
    attributes: { label: "aireviewer-mcp version (aireviewer-mcp version)" }
  - type: markdown
    attributes: { value: "**Security issues:** do not file here — see SECURITY.md." }
