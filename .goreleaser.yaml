# SPDX-License-Identifier: MIT
version: 2
project_name: aireviewer
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - id: aireviewer-mcp
    main: ./cmd/aireviewer-mcp
    binary: aireviewer-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, THIRD_PARTY_NOTICES.md]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
