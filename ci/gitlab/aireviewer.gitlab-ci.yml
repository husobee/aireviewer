# SPDX-License-Identifier: MIT
#
# aireviewer headless augmentation for GitLab CI (SPEC §12, ADR 0011).
# Include from .gitlab-ci.yml:
#
#   include:
#     - local: ci/aireviewer.gitlab-ci.yml
#
# and set CI/CD variables (masked):
#   - ANTHROPIC_API_KEY
#   - GITLAB_TOKEN: a project access token with the api scope and the
#     Reporter role (enough to post MR notes). CI_JOB_TOKEN cannot post notes.
#   - AIREVIEWER_IMAGE: an image built from ci/Dockerfile
# Opt in with ci.post_augmentation: true in .aireviewer.yml on the default
# branch, and add the token's bot user to gate.trusted_bots.
#
# Jobs run only for MRs from this project (not forks), so the token is never
# exposed to fork pipelines; aireviewer runs no MR code in headless mode.

variables:
  AIREVIEWER_IMAGE: registry.example.com/aireviewer-ci:VERSION

aireviewer:augment:
  image: $AIREVIEWER_IMAGE
  stage: test
  interruptible: true
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_DRAFT != "true"
  script:
    - aireviewer-ci review "$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID" "$CI_PROJECT_DIR/.aireviewer-ci"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .aireviewer-ci/.aireviewer/runs/

# On the default branch after a merge: find the MR for the merge commit and
# run the retrospective (metrics and summary in the job log; nothing posted).
aireviewer:retro:
  image: $AIREVIEWER_IMAGE
  stage: test
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      MR_URL="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests" \
        | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s).find(x=>x.state==="merged");if(m)console.log(m.web_url)})')"
      if [ -z "$MR_URL" ]; then echo "no merged MR for $CI_COMMIT_SHA; skipping"; exit 0; fi
      aireviewer-ci retro "$MR_URL" "$CI_PROJECT_DIR/.aireviewer-ci"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .aireviewer-ci/.aireviewer/runs/
