  - id: page-end-out-of-range
    file: store/store.go
    lines: [48, 52]
    category: defect
    match: "range|bound|panic|len|slice"
    severity_min: major
  - id: delete-under-read-lock
    file: store/store.go
    lines: [56, 60]
    category: defect
    match: "rlock|read lock|write lock|race|lock"
    severity_min: major
traps:
  - file: store/store.go
    lines: [21, 37]
    why: Get and Put are unchanged and correct
notes: The Page offset is also unchecked (offset > len panics); a finding about it matches page-end-out-of-range.
