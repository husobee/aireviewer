# Example case: it points at the maintainers' private sandbox repository, so it
# will not run for others. Replace the URL and findings with PRs you can access.
# Seeded defects in husobee/aireviewer-sandbox PR #1 (head 778bbac).
name: sandbox-batch-page
url: https://github.com/husobee/aireviewer-sandbox/pull/1
findings:
  - id: putbatch-unlocked
    file: store/store.go
    lines: [40, 43]
    category: defect
    match: "lock|race|concurren|mutex"
